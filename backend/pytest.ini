[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    real_llm: calls the real LLM gateway (opt-in; see scripts/verify_real_llm.py)
    mocked_llm: planner talks to a scripted LLM stand-in (FakeLLM); proves wiring, not model behavior
    fallback: no LLM or a failing LLM; exercises the deterministic resilience path
